name: Tutorial Validation
on:
  pull_request:
    paths:
      - 'docs/src/content/docs/tutorial/**'
      - 'packages/@livestore/tutorial-agent/**'
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm -w build
      - run: pnpm --filter @livestore/tutorial-agent exec playwright install --with-deps
      - name: Validate tutorial
        run: pnpm -w tutorial-agent validate --config docs/tutorial-agent.config.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tutorial-artifacts
          path: |
            .tutorial-artifacts/**


